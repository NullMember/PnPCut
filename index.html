<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print &amp; Cut Card Grid Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

  <header>
    <h1>Print &amp; Cut Card Grid Generator</h1>
    <p class="subtitle">Generates an SVG of your card cutting grid, pre-aligned for Cricut Design Space's 0.5&Prime; mat margin.</p>
    <nav class="tool-nav">
      <a class="nav-link current" href="index.html">Grid tool</a>
      <a class="nav-link" href="editor.html">Card editor &rarr;</a>
      <a class="nav-link" href="sheet.html">Sheet assembler &rarr;</a>
    </nav>
  </header>

  <div class="content">
    <div class="sidebar">
      <form id="form">

        <div class="panel">
          <div class="panel-title">Card</div>
          <div class="control-group">
            <label for="cardW">Width (mm)</label>
            <input type="number" id="cardW" value="63" min="1" step="0.1" required>
          </div>
          <div class="control-group">
            <label for="cardH">Height (mm)</label>
            <input type="number" id="cardH" value="88" min="1" step="0.1" required>
          </div>
          <div class="control-group">
            <label for="radius">Corner radius (mm)</label>
            <input type="number" id="radius" value="3" min="0" step="0.1" required>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Bleed &amp; Spacing <span class="help" tabindex="0" data-tip="Gap and edge margin default to 2× and 1× the bleed amount — edit them once and they'll stop auto-updating.">?</span></div>
          <div class="control-group">
            <label for="bleed">Bleed per card (mm)</label>
            <input type="number" id="bleed" value="2" min="0" step="0.1" required>
          </div>
          <div class="control-group">
            <label for="gap">Gap between cards (mm)</label>
            <input type="number" id="gap" value="4" min="0" step="0.1" required>
          </div>
          <div class="control-group">
            <label for="edgeMargin">Gap from guide edge to nearest card (mm)</label>
            <input type="number" id="edgeMargin" value="2" min="0" step="0.1" required>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Paper</div>
          <div class="control-group">
            <label for="paperPreset">Preset</label>
            <select id="paperPreset">
              <option value="a4">A4 (210 &times; 297 mm)</option>
              <option value="letter">US Letter (215.9 &times; 279.4 mm)</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="row">
            <div class="control-group">
              <label for="paperW">Width (mm)</label>
              <input type="number" id="paperW" value="210" min="1" step="0.1" required>
            </div>
            <div class="control-group">
              <label for="paperH">Height (mm)</label>
              <input type="number" id="paperH" value="297" min="1" step="0.1" required>
            </div>
          </div>
          <div class="control-group">
            <label class="inline"><input type="checkbox" id="landscape"> Landscape</label>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Cricut Machine <span class="help" tabindex="0" data-tip="The mat area your machine can't cut into — defaults to 0.25&Prime; (6.35mm), Cricut's standard dead margin.">?</span></div>
          <div class="control-group">
            <label for="machineMargin">Mat dead margin (mm)</label>
            <input type="number" id="machineMargin" value="6.35" min="0" step="0.1" required>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Grid</div>
          <div class="control-group">
            <label class="inline"><input type="checkbox" id="autoFit" checked> Auto-fit maximum grid</label>
          </div>
          <div class="row">
            <div class="control-group">
              <label for="cols">Columns</label>
              <input type="number" id="cols" value="1" min="1" step="1" required disabled>
            </div>
            <div class="control-group">
              <label for="rowsInput">Rows</label>
              <input type="number" id="rowsInput" value="1" min="1" step="1" required disabled>
            </div>
          </div>
        </div>

        <div id="warning" class="status error" hidden></div>

        <div class="button-group">
          <button type="button" id="downloadBtn" class="btn-primary">Download SVG</button>
        </div>
      </form>
    </div>

    <div class="main">
      <div class="preview-section">
        <div class="preview-title">Preview</div>
        <div id="summary" class="summary"></div>
        <div id="svgWrap" class="svg-wrap"></div>
      </div>
    </div>
  </div>

</div>
<script src="js/grid-math.js"></script>
<script src="js/app.js"></script>
</body>
</html>
